name: Auto Increment Version on Push

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-version:
    # Skip if the push already came from this workflow
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure version is incremented and tagged
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force || true

          RESULT=$(node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");

            function parseVer(v) {
              const m = String(v || "").trim().replace(/^v/, "").match(/^(\d+)\.(\d+)\.(\d+)/);
              return m ? [Number(m[1]), Number(m[2]), Number(m[3])] : [1, 0, 0];
            }
            function cmpVer(a, b) {
              for (let i = 0; i < 3; i++) {
                if (a[i] !== b[i]) return a[i] - b[i];
              }
              return 0;
            }

            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const headVer = parseVer(pkg.version);

            let beforeVer = null;
            const beforeSha = process.env.BEFORE_SHA;
            if (beforeSha && !/^0+$/.test(beforeSha)) {
              try {
                const beforePkg = JSON.parse(execSync(`git show ${beforeSha}:package.json`, { encoding: "utf8", stdio: ["pipe", "pipe", "ignore"] }));
                beforeVer = parseVer(beforePkg.version);
              } catch {}
            }

            let maxVer = beforeVer ? [...beforeVer] : [...headVer];
            try {
              const tags = execSync("git tag -l \"v*\"", { encoding: "utf8" }).split(/\r?\n/).filter(Boolean);
              for (const t of tags) {
                const tv = parseVer(t);
                if (cmpVer(tv, maxVer) > 0) maxVer = tv;
              }
            } catch {}

            // If HEAD already incremented the version beyond beforeVer and all existing tags, no extra commit is needed
            if (beforeVer && cmpVer(headVer, beforeVer) > 0 && cmpVer(headVer, maxVer) >= 0) {
              process.stdout.write(`TAG_ONLY:${headVer.join(".")}`);
              process.exit(0);
            }

            if (cmpVer(headVer, maxVer) > 0) {
              maxVer = [...headVer];
            }
            const nextVer = [maxVer[0], maxVer[1], maxVer[2] + 1].join(".");
            pkg.version = nextVer;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");

            if (fs.existsSync("package-lock.json")) {
              const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
              lock.version = nextVer;
              if (lock.packages && lock.packages[""]) {
                lock.packages[""].version = nextVer;
              }
              fs.writeFileSync("package-lock.json", JSON.stringify(lock, null, 2) + "\n");
            }

            process.stdout.write(`BUMPED:${nextVer}`);
          ')

          MODE="${RESULT%%:*}"
          VERSION="${RESULT#*:}"

          if [ "$MODE" = "TAG_ONLY" ]; then
            echo "Version was already incremented to v${VERSION} in the pushed commit. Updating tag only."
            git tag -f "v${VERSION}"
            git push origin -f "refs/tags/v${VERSION}"
          elif [ "$MODE" = "BUMPED" ]; then
            echo "Incremented version to v${VERSION}. Committing and pushing..."
            git add package.json package-lock.json
            git commit -m "chore(release): v${VERSION} [skip ci]"
            git tag -f "v${VERSION}"
            git push origin HEAD:main
            git push origin -f "refs/tags/v${VERSION}"
          fi
